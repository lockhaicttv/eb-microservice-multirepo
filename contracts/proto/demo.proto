syntax = "proto3";

package demo;

// ============ Auth ============

// Roles travel as a plain string rather than a proto enum, so a service running
// an older contract still parses a role it has never seen. Consumers must treat
// an unknown value as CUSTOMER (least privilege).
// Defined roles: "ADMIN", "EVENT_OWNER", "CUSTOMER".

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  // Role governs what this user may do. Registered users are always CUSTOMER;
  // promotion to EVENT_OWNER / ADMIN is an admin-only operation, so the role is
  // never accepted as input on Register.
  // One of: ADMIN, EVENT_OWNER, CUSTOMER.
  string role = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  string accessToken = 1;
  User user = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string accessToken = 1;
  User user = 2;
}

message ValidateTokenRequest {
  string accessToken = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
}

// Admin-only reads and role management. The caller proves it is an admin by
// passing its own accessToken: the backend re-verifies it against this service
// rather than trusting the BFF to have done the check.
message ListUsersRequest {
  string accessToken = 1;
}

message ListUsersResponse {
  repeated User users = 1;
}

message SetUserRoleRequest {
  string accessToken = 1;
  string userId = 2;
  string role = 3;
}

message SetUserRoleResponse {
  User user = 1;
}

// ============ Catalog ============

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  // Auth-backend user id of the event owner. Empty string means the event is
  // platform-curated (the seeded listings) and belongs to no user.
  // Field 6 was added in contract 0.5.0; older readers ignore it.
  string ownerUserId = 6;
}

message ListProductsRequest {
  string query = 1;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message GetProductRequest {
  string productId = 1;
}

message GetProductResponse {
  Product product = 1;
}

// Event-owner writes. Like the auth admin RPCs, the caller proves its role by
// passing its own accessToken: catalog-backend re-validates it against
// auth-backend instead of trusting the BFF to have done the check.
message CreateProductRequest {
  string accessToken = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
}

message CreateProductResponse {
  Product product = 1;
}

message ListOwnerProductsRequest {
  string accessToken = 1;
}

message ListOwnerProductsResponse {
  repeated Product products = 1;
}

// ============ Order ============

message OrderLine {
  string productId = 1;
  string productName = 2;
  double unitPrice = 3;
  int32 quantity = 4;
}

message Order {
  string id = 1;
  string userId = 2;
  repeated OrderLine lineItems = 3;
  double totalAmount = 4;
  string status = 5;
  string createdAt = 6;
}

message CreateOrderRequest {
  string userId = 1;
  repeated OrderLine lineItems = 2;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string orderId = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string userId = 1;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}

// ============ Payment ============

message Payment {
  string id = 1;
  string orderId = 2;
  string userId = 3;
  double totalAmount = 4;
  string status = 5;
  string reason = 6;
  string createdAt = 7;
}

message ListPaymentsRequest {
  string orderId = 1;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
}

// ============ Notification ============

message Notification {
  string id = 1;
  string userId = 2;
  string type = 3;
  string message = 4;
  string createdAt = 5;
}

message ListNotificationsRequest {
  string userId = 1;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

// ============ Services ============

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  // Admin only. Rejects with PERMISSION_DENIED unless accessToken belongs to
  // an ADMIN.
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc SetUserRole (SetUserRoleRequest) returns (SetUserRoleResponse);
}

service CatalogService {
  // Public browse surface: no token, every listing is visible to everyone.
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);

  // Owner surface (contract 0.5.0). EVENT_OWNER or ADMIN.
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc ListOwnerProducts (ListOwnerProductsRequest) returns (ListOwnerProductsResponse);
}

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
}

service PaymentService {
  rpc ListPayments (ListPaymentsRequest) returns (ListPaymentsResponse);
}

service NotificationService {
  rpc ListNotifications (ListNotificationsRequest) returns (ListNotificationsResponse);
}